databases:
  - name: atomquest-db
    plan: free
    postgresMajorVersion: "15"

services:
  # 1. Node.js Express Backend
  - type: web
    name: atomquest-backend
    env: node
    plan: free
    rootDir: server
    buildCommand: npm install && npx prisma generate && npx prisma migrate deploy
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: atomquest-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production

  # 2. React Static Frontend
  - type: web
    name: atomquest-frontend
    env: static
    plan: free
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: atomquest-backend
          envVarKey: RENDER_EXTERNAL_URL
          property: value
          format: "{value}/api"
